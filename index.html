<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltMaster</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            margin-top: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        /* Шапка */
        .app-header {
            background: #18181b;
            color: white;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header h1 {
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .logo-volt {
            color: #ffffff;
        }

        .logo-master {
            color: #f59e0b;
        }

        #user-info {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            color: #d1d5db;
        }

        /* Элементы форм */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            background: #27272a;
            color: #ffffff;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: #121212;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: #ffffff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: var(--success);
            color: #ffffff;
        }
        .btn-success:hover {
            background: #16a34a;
        }

        .btn-secondary {
            background: #3f3f46;
            color: #ffffff;
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        .btn-secondary:hover {
            background: #52525b;
        }

        .screen {
            padding: 20px;
            display: none;
        }

        .screen.active {
            display: block;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #71717a;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            font-size: 0.95rem;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .admin-section {
            margin-bottom: 25px;
        }

        .admin-section h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            color: #f3f4f6;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: #d1d5db;
        }

        th {
            background-color: #27272a;
            color: #ffffff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .actions-cell select {
            padding: 6px;
            font-size: 0.85rem;
            width: auto;
            background: #18181b;
        }

        .actions-cell button {
            padding: 6px 10px;
            font-size: 0.8rem;
            width: auto;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        /* Полноэкранный режим для prais30.html / prais50.html через iframe */
        #fullscreen-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            z-index: 9999;
            display: none;
            flex-direction: column;
        }
        #fullscreen-screen.active {
            display: flex;
        }
        .fullscreen-header {
            background: #18181b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .fullscreen-iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- Шапка приложения -->
        <div class="app-header">
            <div class="header-top">
                <h1><span class="logo-volt">VOLT</span><span class="logo-master">MASTER</span></h1>
            </div>
            <div id="user-info">
                <span id="current-username" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px;"></span>
                <button onclick="logout()" class="btn-secondary">Выйти</button>
            </div>
        </div>

        <!-- Экран 1: Авторизация и Заявки -->
        <div id="auth-screen" class="screen active">
            <div class="tabs">
                <div class="tab active" onclick="switchAuthTab('login')">Вход</div>
                <div class="tab" onclick="switchAuthTab('apply')">Подать заявку</div>
            </div>

            <div id="auth-alert"></div>

            <!-- Вкладка Входа -->
            <div id="login-form-container">
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Логин</label>
                        <input type="text" id="login-username" required placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Пароль</label>
                        <input type="password" id="login-password" required placeholder="Введите пароль">
                    </div>
                    <button type="submit">Войти</button>
                </form>
            </div>

            <!-- Вкладка Заявки -->
            <div id="apply-form-container" style="display: none;">
                <form id="apply-form" onsubmit="handleApply(event)">
                    <div class="form-group">
                        <label for="apply-username">Желаемый логин</label>
                        <input type="text" id="apply-username" required placeholder="Придумайте логин">
                    </div>
                    <div class="form-group">
                        <label for="apply-password">Пароль</label>
                        <input type="password" id="apply-password" required placeholder="Придумайте пароль">
                    </div>
                    <div class="form-group">
                        <label for="apply-comment">Комментарий к заявке</label>
                        <textarea id="apply-comment" rows="3" placeholder="Зачем вам нужен аккаунт?"></textarea>
                    </div>
                    <button type="submit">Отправить заявку</button>
                </form>
            </div>
        </div>

        <!-- Экран 2: Панель Пользователя -->
        <div id="user-screen" class="screen">
            <h2>Личный кабинет</h2>
            <p style="margin-top: 15px; color: #9ca3af; font-size: 0.95rem;">Вы успешно вошли в систему VoltMaster.</p>
        </div>

        <!-- Экран 3: Панель Администратора -->
        <div id="admin-screen" class="screen">
            <h2>Панель Администратора</h2>
            <p style="margin-bottom: 20px; color: #9ca3af; font-size: 0.9rem;">Управление пользователями и заявками.</p>

            <div id="admin-alert"></div>

            <!-- Секция: Создание аккаунта админом -->
            <div class="admin-section">
                <h3>Создать аккаунт</h3>
                <form id="create-user-form" onsubmit="handleAdminCreateUser(event)">
                    <div class="form-group">
                        <label>Логин</label>
                        <input type="text" id="admin-new-username" required placeholder="Логин">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="admin-new-password" required placeholder="Пароль">
                    </div>
                    <div class="form-group">
                        <label>Тариф</label>
                        <select id="admin-new-tariff">
                            <option value="none">Обычный</option>
                            <option value="70/30">70/30 (prais30.html)</option>
                            <option value="50/50">50/50 (prais50.html)</option>
                        </select>
                    </div>
                    <button type="submit">Создать аккаунт</button>
                </form>
            </div>

            <!-- Секция: Заявки на создание аккаунта -->
            <div class="admin-section">
                <h3>Заявки на регистрацию</h3>
                <div id="applications-list">
                    <p style="color: #71717a; font-size: 0.9rem;">Нет новых заявок.</p>
                </div>
            </div>

            <!-- Секция: Список пользователей -->
            <div class="admin-section">
                <h3>Список пользователей</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Логин</th>
                                <th>Тариф (можно изменить)</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Динамически заполняется -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Полноэкранный режим через iframe для prais30.html и prais50.html -->
    <div id="fullscreen-screen">
        <div class="fullscreen-header">
            <span style="font-weight: 600; color: #f59e0b; font-size: 1.05rem;" id="fullscreen-title">Прайс-лист</span>
            <button onclick="logout()" class="btn-secondary">Выйти</button>
        </div>
        <iframe id="fullscreen-iframe" class="fullscreen-iframe"></iframe>
    </div>

    <script>
        function initStorage() {
            if (!localStorage.getItem('volt_users')) {
                const defaultUsers = [
                    { username: 'Gazik0303', password: 'Gazik0303', role: 'admin', tariff: 'none' }
                ];
                localStorage.setItem('volt_users', JSON.stringify(defaultUsers));
            }
            if (!localStorage.getItem('volt_applications')) {
                localStorage.setItem('volt_applications', JSON.stringify([]));
            }
        }

        initStorage();

        function switchAuthTab(tabName) {
            const loginTab = document.querySelector('.tabs .tab:nth-child(1)');
            const applyTab = document.querySelector('.tabs .tab:nth-child(2)');
            const loginContainer = document.getElementById('login-form-container');
            const applyContainer = document.getElementById('apply-form-container');
            
            clearAlerts();

            if (tabName === 'login') {
                loginTab.classList.add('active');
                applyTab.classList.remove('active');
                loginContainer.style.display = 'block';
                applyContainer.style.display = 'none';
            } else {
                applyTab.classList.add('active');
                loginTab.classList.remove('active');
                applyContainer.style.display = 'block';
                loginContainer.style.display = 'none';
            }
        }

        function showAlert(containerId, message, type = 'error') {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        function clearAlerts() {
            document.getElementById('auth-alert').innerHTML = '';
            document.getElementById('admin-alert').innerHTML = '';
        }

        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value;

            const users = JSON.parse(localStorage.getItem('volt_users'));
            const user = users.find(u => u.username === usernameInput && u.password === passwordInput);

            if (user) {
                localStorage.setItem('volt_current_user', JSON.stringify(user));
                routeUser(user);
            } else {
                showAlert('auth-alert', 'Неверный логин или пароль!');
            }
        }

        function handleApply(event) {
            event.preventDefault();
            const username = document.getElementById('apply-username').value.trim();
            const password = document.getElementById('apply-password').value;
            const comment = document.getElementById('apply-comment').value.trim();

            const users = JSON.parse(localStorage.getItem('volt_users'));
            const applications = JSON.parse(localStorage.getItem('volt_applications'));

            if (users.some(u => u.username === username)) {
                showAlert('auth-alert', 'Пользователь с таким логином уже существует!');
                return;
            }

            if (applications.some(a => a.username === username)) {
                showAlert('auth-alert', 'Заявка с таким логином уже ожидает рассмотрения!');
                return;
            }

            applications.push({ id: Date.now(), username, password, comment });
            localStorage.setItem('volt_applications', JSON.stringify(applications));

            showAlert('auth-alert', 'Заявка успешно отправлена администратору!', 'success');
            document.getElementById('apply-form').reset();
        }

        function routeUser(user) {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('user-screen').classList.remove('active');
            document.getElementById('admin-screen').classList.remove('active');
            document.getElementById('fullscreen-screen').classList.remove('active');

            if (user.role === 'admin') {
                document.getElementById('main-container').style.display = 'block';
                document.getElementById('user-info').style.display = 'flex';
                document.getElementById('current-username').textContent = `${user.username}`;
                document.getElementById('admin-screen').classList.add('active');
                loadAdminData();
            } else {
                if (user.tariff === '70/30' || user.tariff === '50/50') {
                    document.getElementById('main-container').style.display = 'none';
                    document.getElementById('fullscreen-title').textContent = `${user.username} (Тариф ${user.tariff})`;
                    
                    const iframe = document.getElementById('fullscreen-iframe');
                    if (user.tariff === '70/30') {
                        iframe.src = 'prais30.html';
                    } else {
                        iframe.src = 'prais50.html';
                    }

                    document.getElementById('fullscreen-screen').classList.add('active');
                } else {
                    document.getElementById('main-container').style.display = 'block';
                    document.getElementById('user-info').style.display = 'flex';
                    document.getElementById('current-username').textContent = `${user.username}`;
                    document.getElementById('user-screen').classList.add('active');
                }
            }
        }

        function logout() {
            localStorage.removeItem('volt_current_user');
            document.getElementById('fullscreen-iframe').src = '';
            document.getElementById('main-container').style.display = 'block';
            document.getElementById('user-info').style.display = 'none';
            document.getElementById('admin-screen').classList.remove('active');
            document.getElementById('user-screen').classList.remove('active');
            document.getElementById('fullscreen-screen').classList.remove('active');
            document.getElementById('auth-screen').classList.add('active');
            document.getElementById('login-form').reset();
            clearAlerts();
        }

        function loadAdminData() {
            renderUsersTable();
            renderApplicationsList();
        }

        function renderUsersTable() {
            const users = JSON.parse(localStorage.getItem('volt_users'));
            const currentUser = JSON.parse(localStorage.getItem('volt_current_user'));
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                let actionsHtml = '';
                let tariffSelectHtml = '';

                if (user.role !== 'admin') {
                    tariffSelectHtml = `
                        <select onchange="updateUserTariff('${user.username}', this.value)">
                            <option value="none" ${user.tariff === 'none' ? 'selected' : ''}>Обычный</option>
                            <option value="70/30" ${user.tariff === '70/30' ? 'selected' : ''}>70/30 (prais30.html)</option>
                            <option value="50/50" ${user.tariff === '50/50' ? 'selected' : ''}>50/50 (prais50.html)</option>
                        </select>
                    `;
                } else {
                    tariffSelectHtml = `<span>Администратор</span>`;
                }
                
                if (user.username !== 'Gazik0303' && user.username !== currentUser.username) {
                    actionsHtml = `<button class="btn-danger" onclick="deleteUser('${user.username}')">Удалить</button>`;
                } else {
                    actionsHtml = `<span style="color: #71717a; font-size: 0.8rem;">Защищено</span>`;
                }

                tr.innerHTML = `
                    <td>${user.username}</td>
                    <td>${tariffSelectHtml}</td>
                    <td class="actions-cell">${actionsHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateUserTariff(username, newTariff) {
            let users = JSON.parse(localStorage.getItem('volt_users'));
            const user = users.find(u => u.username === username);
            if (user) {
                user.tariff = newTariff;
                localStorage.setItem('volt_users', JSON.stringify(users));
                showAlert('admin-alert', `Тариф для пользователя "${username}" изменен на ${newTariff}!`, 'success');
            }
        }

        function renderApplicationsList() {
            const applications = JSON.parse(localStorage.getItem('volt_applications'));
            const container = document.getElementById('applications-list');

            if (!applications || applications.length === 0) {
                container.innerHTML = '<p style="color: #71717a; font-size: 0.9rem;">Нет новых заявок.</p>';
                return;
            }

            let html = `
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Логин</th>
                                <th>Выбор тарифа и действия</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            applications.forEach(app => {
                html += `
                    <tr>
                        <td><strong>${app.username}</strong><br><small style="color: #9ca3af;">${app.comment || ''}</small></td>
                        <td class="actions-cell">
                            <select id="tariff-${app.id}">
                                <option value="70/30">70/30 (prais30.html)</option>
                                <option value="50/50">50/50 (prais50.html)</option>
                                <option value="none">Обычный</option>
                            </select>
                            <button class="btn-success" onclick="approveApplication(${app.id})">Одобрить</button>
                            <button class="btn-danger" onclick="rejectApplication(${app.id})">Отклонить</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        function handleAdminCreateUser(event) {
            event.preventDefault();
            const username = document.getElementById('admin-new-username').value.trim();
            const password = document.getElementById('admin-new-password').value;
            const tariff = document.getElementById('admin-new-tariff').value;

            const users = JSON.parse(localStorage.getItem('volt_users'));
            if (users.some(u => u.username === username)) {
                showAlert('admin-alert', 'Пользователь уже существует!');
                return;
            }

            users.push({ username, password, role: 'user', tariff });
            localStorage.setItem('volt_users', JSON.stringify(users));

            showAlert('admin-alert', `Аккаунт "${username}" создан!`, 'success');
            document.getElementById('create-user-form').reset();
            renderUsersTable();
        }

        function deleteUser(username) {
            if (confirm(`Удалить пользователя ${username}?`)) {
                let users = JSON.parse(localStorage.getItem('volt_users'));
                users = users.filter(u => u.username !== username);
                localStorage.setItem('volt_users', JSON.stringify(users));
                renderUsersTable();
                showAlert('admin-alert', `Пользователь ${username} удален.`, 'success');
            }
        }

        function approveApplication(appId) {
            let applications = JSON.parse(localStorage.getItem('volt_applications'));
            const appIndex = applications.findIndex(a => a.id === appId);
            
            if (appIndex !== -1) {
                const app = applications[appIndex];
                const selectedTariff = document.getElementById(`tariff-${appId}`).value;
                let users = JSON.parse(localStorage.getItem('volt_users'));
                
                users.push({ username: app.username, password: app.password, role: 'user', tariff: selectedTariff });
                localStorage.setItem('volt_users', JSON.stringify(users));

                applications.splice(appIndex, 1);
                localStorage.setItem('volt_applications', JSON.stringify(applications));

                loadAdminData();
                showAlert('admin-alert', `Заявка ${app.username} одобрена с тарифом ${selectedTariff}!`, 'success');
            }
        }

        function rejectApplication(appId) {
            let applications = JSON.parse(localStorage.getItem('volt_applications'));
            applications = applications.filter(a => a.id !== appId);
            localStorage.setItem('volt_applications', JSON.stringify(applications));
            loadAdminData();
            showAlert('admin-alert', 'Заявка отклонена.', 'success');
        }

        window.onload = function() {
            const currentUser = JSON.parse(localStorage.getItem('volt_current_user'));
            if (currentUser) {
                routeUser(currentUser);
            }
        };
    </script>
</body>
</html>
